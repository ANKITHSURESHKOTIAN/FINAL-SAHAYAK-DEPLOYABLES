    .skip-link {

      top: -100px;
      left: 1rem;
      background: #d4af37;
      color: #031427;
      padding: 0.5rem 1rem;
      font-weight: 700;
      z-index: 100;
      transition: top 0.2s ease;
      border-radius: 0 0 4px 4px;
    }
    .skip-link:focus {
      top: 0;
    }

    /* Indian Tricolor Strip */
    .national-tricolor-strip {
      height: 5px;
      background: linear-gradient(90deg, #ff9933 0%, #ff9933 33.3%, #ffffff 33.3%, #ffffff 66.6%, #138808 66.6%, #138808 100%);
      position: relative;
    }
    .national-tricolor-strip::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
      animation: shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Keyboard focus ring styling */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #d4af37 !important;
      outline-offset: 2px !important;
    }

    /* Senior Mode accessibility overrides */
    .senior-accessible-mode {
      font-size: 1.125rem !important; /* 18px base */
    }
    .senior-accessible-mode label {
      font-size: 1.05rem !important; /* ~17px */
      font-weight: 800 !important;
      color: #031427 !important;
    }
    .senior-accessible-mode input {
      padding-top: 0.9rem !important;
      padding-bottom: 0.9rem !important;
      font-size: 1.15rem !important;
      border-width: 2px !important;
      border-color: #082447 !important;
    }
    .senior-accessible-mode .btn-primary-action {
      padding-top: 1.1rem !important;
      padding-bottom: 1.1rem !important;
      font-size: 1.25rem !important;
      font-weight: 800 !important;
    }

    .captcha-code-box {
      background: repeating-linear-gradient(
        45deg,
        #082447,
        #082447 12px,
        #0f2848 12px,
        #0f2848 24px
      );
      letter-spacing: 0.4em;
      user-select: none;
    }

    .premium-login-panel {
      position:relative;
      overflow:hidden;
      box-shadow:0 20px 52px rgba(8,36,71,.14);
    }
    .premium-login-panel::before {
      content:''; position:absolute; width:18rem; height:18rem; border-radius:50%;
      top:-10rem; right:-8rem; background:radial-gradient(circle,rgba(212,175,55,.18),transparent 68%); pointer-events:none;
    }
    .role-card { transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .role-card:hover { transform:translateY(-4px); box-shadow:0 12px 26px rgba(8,36,71,.12); }
    .captcha-code-box { min-height:44px; display:flex; align-items:center; justify-content:center; }

    /* Watermark Seal Background for Card */
    .emblem-watermark {
      background-image: url('ksp_emblem.png');
      background-repeat: no-repeat;
      background-position: right 10px bottom 10px;
      background-size: 160px;
      opacity: 0.98;
    }

    /* Spinner Animation */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin-fast {
      animation: spin 0.8s linear infinite;
    }

      .login-shell { padding-left:1rem !important; padding-right:1rem !important; }

      .login-heading { font-size:1.55rem !important; }
      .role-grid { grid-template-columns:1fr !important; }
      .captcha-code-box { letter-spacing:.25em; }

    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function App() {
      // Language state: 'en' | 'kn' | 'hi'
      const [lang, setLang] = useState('en');
      const t = i18n[lang];

      // Text scale state: 1, 1.12, 1.25
      const [fontScale, setFontScale] = useState(1);
      const [highContrast, setHighContrast] = useState(false);

      useEffect(() => {
        document.documentElement.style.setProperty('--font-scale', fontScale);
      }, [fontScale]);

      useEffect(() => {
        if (highContrast) {
          document.body.classList.add('high-contrast');
        } else {
          document.body.classList.remove('high-contrast');
        }
      }, [highContrast]);

      // Active category: 'citizen' | 'volunteer' | 'senior'
      const [category, setCategory] = useState('citizen');

      // Login mode: 'password' | 'otp'
      const [loginMode, setLoginMode] = useState('password');

      // Form state
      const [identifier, setIdentifier] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [captchaInput, setCaptchaInput] = useState('');
      const [captchaCode, setCaptchaCode] = useState(generateCaptcha);
      const [rememberMe, setRememberMe] = useState(false);

      // OTP state
      const [otpInput, setOtpInput] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [otpTimer, setOtpTimer] = useState(0);

      // Status states
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [loginSuccess, setLoginSuccess] = useState(false);
      const [registeredModal, setRegisteredModal] = useState(false);
      const [forgotModal, setForgotModal] = useState(false);
      const [screenReaderModal, setScreenReaderModal] = useState(false);

      // Login method: 'emailphone' | 'sahayakid'
      const [loginMethod, setLoginMethod] = useState('emailphone');

      // Registration Flow State
      const [regStep, setRegStep] = useState(1);
      const [regName, setRegName] = useState('');
      const [regMobile, setRegMobile] = useState('');
      const [regIdType, setRegIdType] = useState('Aadhaar Card');
      const [regIdNum, setRegIdNum] = useState('');
      const [regDistrict, setRegDistrict] = useState('Udupi (Shirva Station Jurisdiction)');
      const [regPassword, setRegPassword] = useState('');
      const [regOtp, setRegOtp] = useState('');
      const [regErrors, setRegErrors] = useState({});
      const [generatedSahayakId, setGeneratedSahayakId] = useState('');
      const [regPhoto, setRegPhoto] = useState(null); // base64 data URL
      const [regPhotoName, setRegPhotoName] = useState('');
      const [regDob, setRegDob] = useState('');
      const [regBloodGroup, setRegBloodGroup] = useState('');
      const [regSeniorCardNumber, setRegSeniorCardNumber] = useState('');
      const [regEmergencyName, setRegEmergencyName] = useState('');
      const [regEmergencyPhone, setRegEmergencyPhone] = useState('');
      const [regPreferredLanguages, setRegPreferredLanguages] = useState(['Kannada']);
      const [regOtherLanguage, setRegOtherLanguage] = useState('');
      const [idCopied, setIdCopied] = useState(false);

      // Determine registration role from category
      const getRegRole = () => category === 'volunteer' ? 'volunteer' : 'senior';

      const openRegistration = () => {
        setRegStep(1);
        setRegName('');
        setRegMobile('');
        setRegIdNum('');
        setRegPassword('');
        setRegOtp('');
        setRegErrors({});
        setRegPhoto(null);
        setRegPhotoName('');
        setRegDob('');
        setRegBloodGroup('');
        setRegSeniorCardNumber('');
        setRegEmergencyName('');
        setRegEmergencyPhone('');
        setRegPreferredLanguages(['Kannada']);
        setRegOtherLanguage('');
        setIdCopied(false);
        setRegisteredModal(true);
      };

      const handleRegSubmitStep1 = (e) => {
        e.preventDefault();
        const errs = {};
        if (!regName || regName.trim().length < 3) errs.name = "Please enter full name (min 3 characters).";
        if (!regMobile || !/^[6-9]\d{9}$/.test(regMobile.trim())) errs.mobile = "Please enter a valid 10-digit mobile number.";
        if (!regIdNum || regIdNum.trim().length < 4) errs.idNum = "Please enter a valid Government ID number.";
        if (!regPassword || regPassword.length < 6) errs.password = "Password must be at least 6 characters.";
        if (category === 'senior') {
          if (!regDob) errs.dob = "Please enter date of birth.";
          if (!regBloodGroup) errs.bloodGroup = "Please select blood group.";
          if (!regEmergencyName.trim()) errs.emergencyName = "Please enter emergency contact name.";
          if (!/^[6-9]\d{9}$/.test(regEmergencyPhone.trim())) errs.emergencyPhone = "Please enter a valid emergency contact number.";
          if (!regPreferredLanguages.length) errs.preferredLanguages = "Please select at least one preferred language.";
        }
        if (Object.keys(errs).length > 0) { setRegErrors(errs); return; }
        setRegErrors({});
        setRegStep(1.5); // Photo upload step
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/') || file.size > 5 * 1024 * 1024) {
          setRegErrors({ photo: 'Please select a JPG or PNG image smaller than 5MB.' });
          return;
        }
        setRegErrors({});
        setRegPhotoName(file.name);
        const reader = new FileReader();
        reader.onload = (ev) => setRegPhoto(ev.target.result);
        reader.readAsDataURL(file);
      };

      const toggleRegistrationLanguage = (value) => setRegPreferredLanguages(previous => previous.includes(value) ? previous.filter(item => item !== value) : [...previous, value]);
      const addRegistrationLanguage = () => {
        const value = regOtherLanguage.trim();
        if (!value) return;
        setRegPreferredLanguages(previous => previous.includes(value) ? previous : [...previous, value]);
        setRegOtherLanguage('');
      };

      const handleRegVerifyOtp = (e) => {
        e.preventDefault();
        if (!regOtp || regOtp.trim().length !== 6) {
          setRegErrors({ otp: "Please enter 6-digit OTP code." });
          return;
        }
        setRegErrors({});
        // Generate role-specific Sahayak ID
        const num = String(Math.floor(100 + Math.random() * 900)).padStart(6, '0');
        const roleCode = category === 'volunteer' ? 'VL' : 'SC';
        const sahayakId = `SAH-${roleCode}-${num}`;
        setGeneratedSahayakId(sahayakId);
        setRegStep(3);
      };

      const copySahayakId = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(generatedSahayakId).then(() => {
            setIdCopied(true);
            setTimeout(() => setIdCopied(false), 2500);
          });
        } else {
          // Fallback
          const el = document.createElement('textarea');
          el.value = generatedSahayakId;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          setIdCopied(true);
          setTimeout(() => setIdCopied(false), 2500);
        }
      };

      // Generate random captchas
      const refreshCaptcha = () => {
        setCaptchaCode(generateCaptcha());
        setCaptchaInput('');
        setErrors(prev => ({ ...prev, captcha: null }));
      };

      // Speak Captcha audio fallback
      const speakCaptcha = () => {
        if ('speechSynthesis' in window) {
          const text = captchaCode.split('').join(' ');
          const utterance = new SpeechSynthesisUtterance("Captcha code is " + text);
          utterance.rate = 0.8;
          window.speechSynthesis.speak(utterance);
        } else {
          alert("Audio Captcha: Code is " + captchaCode.split('').join(' '));
        }
      };

      // Handle Category Switch
      const handleCategoryChange = (catKey) => {
        setCategory(catKey);
        setErrors({});
        setLoginSuccess(false);
        setLoginMethod(catKey === 'citizen' ? 'emailphone' : 'sahayakid');
        refreshCaptcha();
      };

      // OTP Countdown Timer
      useEffect(() => {
        let interval = null;
        if (otpTimer > 0) {
          interval = setInterval(() => {
            setOtpTimer(prev => prev - 1);
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [otpTimer]);

      const handleSendOtp = () => {
        if (!identifier || identifier.trim().length < 5) {
          setErrors({ identifier: t.errIdentifier });
          return;
        }
        setErrors({});
        setOtpSent(true);
        setOtpTimer(30);
      };

      // Form Submit Handler
      const handleSubmit = (e) => {
        e.preventDefault();
        const newErrors = {};

        // Validate identity details for the selected portal role.
        const cleanId = identifier.trim();
        const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanId);
        const isPhone = /^[6-9]\d{9}$/.test(cleanId.replace(/\D/g, ''));
        const isSeniorId = /^SAH-SC-\d{6}$/i.test(cleanId);
        const isVolunteerId = /^SAH-VL-\d{6}$/i.test(cleanId);
        const isValidIdentity = category === 'senior'
          ? (isPhone || isSeniorId)
          : category === 'volunteer'
            ? (isPhone || isVolunteerId)
            : (isEmail || isPhone);
        if (!cleanId || !isValidIdentity) {
          newErrors.identifier = t.errIdentifier;
        }

        if (loginMode === 'password') {
          if (!password || password.length < 6) {
            newErrors.password = t.errPassword;
          }
          if (!captchaInput || captchaInput.trim().toUpperCase() !== captchaCode) {
            newErrors.captcha = t.errCaptcha;
          }
        } else {
          if (!otpSent) {
            newErrors.identifier = "Please click 'Send Security OTP' first.";
          } else if (!otpInput || otpInput.trim().length !== 6) {
            newErrors.otp = t.errOtp;
          }
        }

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          if (newErrors.captcha) refreshCaptcha();
          return;
        }

        setErrors({});
        setIsSubmitting(true);

        // Simulate secure login authentication
        setTimeout(() => {
          setIsSubmitting(false);
          setLoginSuccess(true);
          
          // Auto-redirect based on login category
          setTimeout(() => {
            // pageKeys must match the PAGES map in index.html (parent shell)
            const pageKeyMap   = { citizen: 'portal',        volunteer: 'volunteer',        senior: 'senior' };
            const pageFileMap  = { citizen: 'portal.html',   volunteer: 'volunteer.html',   senior: 'senior.html' };
            const pageKey  = pageKeyMap[category]  || 'portal';
            const pageFile = pageFileMap[category] || 'portal.html';
            window.parent.postMessage({ action: 'goto', page: pageKey }, '*');
            if (window.parent === window) window.location.href = pageFile;
          }, 800);
