      const [regErrors, setRegErrors] = useState({});
      const [generatedKspId, setGeneratedKspId] = useState('');

        setRegStep(1);

        setRegMobile('');
        setRegIdNum('');
        setRegPassword('');
        setRegOtp('');
        setRegErrors({});
        setRegisteredModal(true);

        e.preventDefault();
        const errs = {};
        if (!regName || regName.trim().length < 3) errs.name = "Please enter full name (min 3 characters).";
        if (!regMobile || !/^[6-9]\d{9}$/.test(regMobile.trim())) errs.mobile = "Please enter a valid 10-digit mobile number.";
        if (!regIdNum || regIdNum.trim().length < 4) errs.idNum = "Please enter a valid Government ID number.";
        if (!regPassword || regPassword.length < 6) errs.password = "Password must be at least 6 characters.";
        
        if (Object.keys(errs).length > 0) {
          setRegErrors(errs);
          return;
        }
        setRegErrors({});
        setRegStep(2);
      };

        e.preventDefault();
        if (!regOtp || regOtp.trim().length !== 6) {
          setRegErrors({ otp: "Please enter 6-digit OTP code." });
          return;
        }
        setRegErrors({});
        const kspId = "KSP-CIT-2026-" + Math.floor(10000 + Math.random() * 90000);
        setGeneratedKspId(kspId);
        setRegStep(3);

        setCaptchaInput('');

            setOtpTimer(prev => prev - 1);

          clearInterval(interval);

          }

                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center text-2xl font-bold">
                    <span className="material-symbols-outlined">lock_reset</span>
                  </div>
                  <div>
                    <h3 className="font-extrabold text-lg text-slate-900">Reset Password</h3>
                    <p className="text-xs text-slate-500">Secure Recovery via Registered Mobile / Email</p>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Enter Mobile / Email</label>
                  <input
                    type="text"
                    placeholder="Enter mobile or email"
                    className="w-full px-3 py-2 border border-slate-300 rounded text-sm"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setForgotModal(false)}
                    className="px-4 py-2 border border-slate-300 rounded text-xs font-bold text-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => { alert("Password reset link / OTP has been sent to your registered contact."); setForgotModal(false); }}
                    className="px-4 py-2 bg-kspNavy-800 text-white rounded text-xs font-bold hover:bg-kspNavy-900"
                  >
                    Send Recovery OTP
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Screen Reader Modal */}
          {screenReaderModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border-t-4 border-kspNavy-800 relative space-y-4">
                <button
                  type="button"
                  onClick={() => setScreenReaderModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                >
                  <span className="material-symbols-outlined">close</span>
                </button>
                <h3 className="font-extrabold text-lg text-slate-900 flex items-center gap-2">
                  <span className="material-symbols-outlined text-kspNavy-800">accessibility_new</span>
                  Screen Reader Accessibility
                </h3>
                <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                  This portal complies with Guidelines for Indian Government Websites (GIGW 2.0) and WCAG 2.1 AA standards. It is fully compatible with NVDA, JAWS, VoiceOver, and TalkBack screen readers.
                </p>
                <div className="flex justify-end">
                  <button
                    type="button"
                    onClick={() => setScreenReaderModal(false)}
                    className="px-4 py-2 bg-kspNavy-800 text-white rounded text-xs font-bold"
                  >
                    OK
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 6. OFFICIAL FOOTER */}
          <footer className="bg-kspNavy-900 text-slate-300 border-t-4 border-amber-500 pt-10 pb-8 px-4 sm:px-8 mt-12">
            <div className="max-w-7xl mx-auto space-y-8">
              
              {/* Footer Nav Links */}
              <div className="flex flex-wrap items-center justify-center gap-x-6 gap-y-3 text-xs sm:text-sm font-semibold border-b border-slate-800 pb-6">
                <a href="#about" className="hover:text-amber-400 transition-colors">{t.footerAbout}</a>
                <span className="text-slate-700">•</span>
                <a href="#privacy" className="hover:text-amber-400 transition-colors">{t.footerPrivacy}</a>
                <span className="text-slate-700">•</span>
                <a href="#terms" className="hover:text-amber-400 transition-colors">{t.footerTerms}</a>
                <span className="text-slate-700">•</span>
                <a href="#accessibility" className="hover:text-amber-400 transition-colors">{t.footerAccess}</a>
                <span className="text-slate-700">•</span>
                <a href="#disclaimer" className="hover:text-amber-400 transition-colors">{t.footerDisclaimer}</a>
                <span className="text-slate-700">•</span>
                <a href="#contact" className="hover:text-amber-400 transition-colors">{t.footerContact}</a>
              </div>

              {/* Legal & Copyright */}
              <div className="flex flex-col md:flex-row items-center justify-between text-center md:text-left gap-4 text-xs text-slate-400">
                <div className="space-y-1">
                  <p className="font-semibold text-slate-200">{t.footerManaged}</p>
                  <p>{t.footerCopy}</p>
                </div>
                <div className="space-y-1 md:text-right">
                  <p className="font-medium text-amber-400/90">{t.footerUpdated}</p>
                  <p className="text-slate-500">{t.footerBrowser}</p>
                </div>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
