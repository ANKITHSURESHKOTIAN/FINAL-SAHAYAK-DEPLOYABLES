  <style>
    .material-symbols-outlined { font-family:'Material Symbols Outlined' !important; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; font-feature-settings:'liga'; -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; }
    body {
      background: radial-gradient(circle at 86% -10%, #dbeafe 0, transparent 30rem), radial-gradient(circle at 8% 22%, #fef3c7 0, transparent 24rem), #f4f7fb;
      margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; color:#0f172a;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; }
    button:hover { filter: brightness(1.03); }
    button:active { transform: translateY(1px); }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(212,175,55,.7); outline-offset: 3px; }

    @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .fade-up   { animation: fadeUp 0.4s ease forwards; }
    .fade-up-1 { animation: fadeUp 0.4s 0.08s ease both; }
    .fade-up-2 { animation: fadeUp 0.4s 0.16s ease both; }
    .fade-up-3 { animation: fadeUp 0.4s 0.24s ease both; }
    .fade-up-4 { animation: fadeUp 0.4s 0.32s ease both; }

    .live-dot { animation: pulseDot 1.4s ease-in-out infinite; }

    .card        { background:#fff; border-radius:16px; border:1px solid #e2e8f0; transition:box-shadow 0.2s, transform 0.2s; box-shadow:0 2px 8px rgba(8,36,71,0.06); }
    .card:hover  { box-shadow:0 8px 28px rgba(8,36,71,0.10); transform:translateY(-2px); }
    .card-static { background:rgba(255,255,255,0.96); border-radius:16px; border:1px solid #dbe4f0; box-shadow:0 8px 22px rgba(8,36,71,0.07); }

    .badge-high    { background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; }
    .badge-medium  { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
    .badge-low     { background:#dcfce7; color:#15803d; border:1px solid #bbf7d0; }
    .badge-active  { background:#dbeafe; color:#1d4ed8; border:1px solid #bfdbfe; }
    .badge-route   { background:#ede9fe; color:#6d28d9; border:1px solid #ddd6fe; }
    .badge-done    { background:#dcfce7; color:#15803d; border:1px solid #bbf7d0; }

    .progress-fill { height:5px; border-radius:3px; background:linear-gradient(90deg,#163970,#1a56b2); }

    .mission-card-active { border-left:4px solid #1a56b2; background:linear-gradient(135deg,#f8fafc 0%,#eff6ff 100%); }
    .mission-card-route  { border-left:4px solid #7c3aed; background:linear-gradient(135deg,#f8fafc 0%,#f5f3ff 100%); }

    .stat-card {
      background:#fff; border-radius:12px; border:1px solid #e2e8f0;
      padding:12px 10px; text-align:center;
      box-shadow:0 2px 8px rgba(8,36,71,0.05);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .stat-card:hover { box-shadow:0 6px 20px rgba(8,36,71,0.10); transform:translateY(-2px); }

    .activity-row {
      display:flex; align-items:center; gap:12px;
      padding:10px 16px; border-bottom:1px solid #f1f5f9;
      transition:background 0.15s;
    }
    .activity-row:last-child { border-bottom:none; }
    .activity-row:hover { background:#f8fafc; }

    .info-row {
      display:flex; align-items:flex-start; gap:10px;
      padding:8px 10px; border-radius:9px;
      background:#f8fafc; border:1px solid #e2e8f0; margin-bottom:5px;
    }

    .skill-tag {
      display:inline-flex; align-items:center; gap:5px;
      font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
      background:#f0f4fa; color:#163970; border:1px solid #dbeafe;
    }

    .section-label {
      display:flex; align-items:center; gap:7px; font-size:10px; font-weight:900; color:#163970;
      text-transform:uppercase; letter-spacing:0.1em; margin-bottom:12px;
    }
    .section-label::before { content:''; width:4px; height:13px; border-radius:8px; background:linear-gradient(#d4af37,#b89025); box-shadow:0 1px 5px rgba(212,175,55,.45); }
    .premium-heading { position:relative; display:inline-block; font-size:24px !important; letter-spacing:-0.04em; padding-bottom:8px; }
    .premium-heading::after { content:''; position:absolute; left:0; bottom:0; width:52px; height:3px; border-radius:4px; background:linear-gradient(90deg,#d4af37,#f6d365); }
    .premium-title { font-size:16px; font-weight:900; color:#082447; letter-spacing:-0.02em; }
    .mission-table-head { background:linear-gradient(90deg,#eff6ff,#f8fafc) !important; color:#163970 !important; border-top:3px solid #d4af37; }
    .mission-grid:not(.mission-table-head) { position:relative; }
    .mission-grid:not(.mission-table-head)::before { content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px; background:linear-gradient(#1a56b2,#d4af37); opacity:.72; }
    .volunteer-sidebar-card { overflow:hidden; border-top:4px solid #1a56b2; background:linear-gradient(155deg,#ffffff 0%,#f5f9ff 62%,#fffaf0 100%); }
    .progress-card { border-top:4px solid #7c3aed; background:linear-gradient(135deg,#ffffff 0%,#faf5ff 58%,#f0fdf4 100%); }
    .mission-zone { padding:18px; border-radius:20px; background:linear-gradient(135deg,rgba(239,246,255,.92),rgba(255,255,255,.98) 48%,rgba(255,251,235,.92)); border:1px solid #dbe4f0; box-shadow:0 12px 28px rgba(8,36,71,.08); }
    .mission-zone > div:first-child { padding:2px 4px 12px; border-bottom:1px solid rgba(212,175,55,.35); }

    .mission-grid { display:grid; grid-template-columns:2.5fr 2fr 2fr 1fr; gap:16px; }
    .mission-actions { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
    .profile-summary, .profile-quick-stats { display:none; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }

    @media (max-width: 1100px) {
      .vol-grid { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 820px) {
      .mission-table-head { display:none !important; }
      .mission-grid { grid-template-columns:1fr !important; gap:14px !important; padding:18px !important; }
      .mission-actions { align-items:stretch; }
      .mission-actions > * { max-width:none !important; }
    }
    @media (max-width: 640px) {
      .portal-subtitle { display:none; }
      .portal-wordmark { font-size:16px !important; letter-spacing:.12em !important; }
      .header-action { padding:6px 9px !important; font-size:11px !important; }
      .header-action .material-symbols-outlined { font-size:17px !important; }
      .profile-form-grid { grid-template-columns:1fr !important; }
      .profile-form-grid > div { grid-column:span 1 !important; }
      .stat-grid { grid-template-columns: 1fr 1fr !important; }
    }
  </style>

    function applyLanguage(language) {
      const dictionary = TRANSLATIONS[language] || {};
      const walker = document.createTreeWalker(document.getElementById('root'), NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        const parent = node.parentElement;
        if (!parent || parent.closest('script, style, .material-symbols-outlined')) continue;
        const source = pageTextSources.get(node) || node.nodeValue;
        pageTextSources.set(node, source);
        const leading = source.match(/^\s*/)[0];
        const trailing = source.match(/\s*$/)[0];
        const text = source.trim();
        node.nodeValue = leading + (dictionary[text] || text) + trailing;
      }
      document.querySelectorAll('#root [alt], #root [title], #root [aria-label]').forEach(element => {
        ['alt', 'title', 'aria-label'].forEach(attribute => {
          if (!element.hasAttribute(attribute)) return;
          const values = pageAttributeSources.get(element) || {};
          const source = values[attribute] || element.getAttribute(attribute);
          values[attribute] = source;
          pageAttributeSources.set(element, values);
          element.setAttribute(attribute, dictionary[source] || source);
        });
      });
      document.documentElement.lang = language === 'KN' ? 'kn' : language === 'HI' ? 'hi' : 'en';
      const languagePicker = document.querySelector('[aria-label="Choose language"], [aria-label="ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ"], [aria-label="भाषा चुनें"]');
      if (languagePicker) languagePicker.setAttribute('aria-label', dictionary['Choose language'] || 'Choose language');
      document.title = language === 'KN' ? 'ಸ್ವಯಂಸೇವಕರ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ | ಕೆಎಸ್‌ಪಿ ಸಹಾಯಕ' : language === 'HI' ? 'स्वयंसेवक डैशबोर्ड | केएसपी सहायक' : 'Volunteer Dashboard | KSP Sahayak';

              React.createElement('div', { style: { display:'flex', alignItems:'center', gap:10, flexShrink:0 } },
                React.createElement('span', { className: 'badge-done', style: { fontSize:10, fontWeight:800, padding:'2px 8px', borderRadius:20, border:'1px solid #bbf7d0', textTransform:'uppercase' } }, 'Done')
              )
            );
          })
        )
      );
    }

    function VolunteerDashboard() {
      const [language, setLanguage] = useState('EN');
      const [onDuty, setOnDuty]     = useState(true);
      const [tab, setTab]           = useState('active');
      const [resolved, setResolved] = useState([]);
      const [accepted, setAccepted] = useState([]);
      const [declined, setDeclined] = useState([]);
      const [sideTab, setSideTab]   = useState('profile');
      const [editOpen, setEditOpen] = useState(false);
      const [profile, setProfile]   = useState(VOLUNTEER_PROFILE);
      const [editData, setEditData] = useState({});
      const [idCopied, setIdCopied] = useState(false);

      useEffect(() => { applyLanguage(language); });

      const copyId = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(profile.sahayakId).then(() => {
            setIdCopied(true); setTimeout(() => setIdCopied(false), 2500);
          });
        }
      };

      const openEdit = () => { setEditData({ ...profile }); setEditOpen(true); };
      const saveEdit = () => { setProfile({ ...editData }); setEditOpen(false); };

      const active = MISSIONS.filter(m => !resolved.includes(m.id) && !declined.includes(m.id));
      const histAll = [...HISTORY, ...resolved.map(id => {
        const m = MISSIONS.find(x => x.id === id);
        return m ? { id: m.id, type: m.type, senior: m.senior, date: 'Today' } : null;
      }).filter(Boolean)];

      return (
        <div className="min-h-screen flex flex-col">

          {/* ─── EDIT MODAL ─── */}
          {editOpen && (
            <div style={{ position:'fixed', inset:0, zIndex:100, background:'rgba(2,12,27,0.7)', backdropFilter:'blur(4px)', display:'flex', alignItems:'center', justifyContent:'center', padding:16, overflowY:'auto' }}>
              <div style={{ background:'#fff', borderRadius:20, maxWidth:600, width:'100%', padding:'28px', boxShadow:'0 24px 80px rgba(0,0,0,0.3)', borderTop:'6px solid #082447', margin:'auto' }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20, paddingBottom:16, borderBottom:'1px solid #f1f5f9' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                    <div style={{ width:44, height:44, borderRadius:12, background:'linear-gradient(135deg,#082447,#163970)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                      <span className="material-symbols-outlined" style={{ color:'#d4af37', fontSize:22 }}>edit_square</span>
                    </div>
                    <div>
                      <div style={{ fontWeight:900, fontSize:18, color:'#0f172a' }}>Edit Profile</div>
                      <div style={{ fontSize:12, color:'#64748b' }}>Update your personal information</div>
                    </div>
                  </div>
                  <button onClick={() => setEditOpen(false)} style={{ background:'none', border:'none', cursor:'pointer', color:'#94a3b8', padding:8, borderRadius:8 }}>
                    <span className="material-symbols-outlined">close</span>
                  </button>
                </div>
                <div style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:12, padding:'12px 16px', marginBottom:20, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                  <div>
                    <div style={{ fontSize:10, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:2 }}>Volunteer ID</div>
                    <div style={{ fontFamily:'monospace', fontWeight:800, fontSize:16, color:'#082447' }}>{profile.sahayakId}</div>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, fontWeight:700, color:'#64748b', background:'#f1f5f9', padding:'4px 10px', borderRadius:8, border:'1px solid #e2e8f0' }}>
                    <span className="material-symbols-outlined" style={{ fontSize:14 }}>lock</span> System Generated
                  </div>
                </div>
                <div className="profile-form-grid" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                  {[
                    { label:'Full Name', key:'name', icon:'person' },
                    { label:'Phone Number', key:'phone', icon:'phone' },
                    { label:'Email Address', key:'email', icon:'email' },
                    { label:'Date of Birth', key:'dob', icon:'cake' },
                  ].map(f => (
                    <div key={f.key}>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>
                        <span className="material-symbols-outlined" style={{ fontSize:13, verticalAlign:'middle', marginRight:4, color:'#163970' }}>{f.icon}</span>{f.label}
                      </label>
                      <input value={editData[f.key] || ''} onChange={e => setEditData(prev => ({ ...prev, [f.key]: e.target.value }))}
                        style={{ width:'100%', padding:'10px 12px', border:'1px solid #cbd5e1', borderRadius:10, fontSize:14, fontWeight:600, color:'#0f172a', boxSizing:'border-box', outline:'none' }}
                        onFocus={e => e.target.style.borderColor='#163970'} onBlur={e => e.target.style.borderColor='#cbd5e1'} />
                    </div>
                  ))}
                  <div className="profile-form-address" style={{ gridColumn:'span 2' }}>
                    <label style={{ display:'block', fontSize:11, fontWeight:700, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>
                      <span className="material-symbols-outlined" style={{ fontSize:13, verticalAlign:'middle', marginRight:4, color:'#163970' }}>home</span>Address
                    </label>
                    <input value={editData.address || ''} onChange={e => setEditData(prev => ({ ...prev, address: e.target.value }))}
                      style={{ width:'100%', padding:'10px 12px', border:'1px solid #cbd5e1', borderRadius:10, fontSize:14, fontWeight:600, color:'#0f172a', boxSizing:'border-box', outline:'none' }}
                      onFocus={e => e.target.style.borderColor='#163970'} onBlur={e => e.target.style.borderColor='#cbd5e1'} />
                  </div>
                </div>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:12, marginTop:24, paddingTop:16, borderTop:'1px solid #f1f5f9' }}>
                  <button onClick={() => setEditOpen(false)} style={{ padding:'10px 20px', border:'1px solid #e2e8f0', borderRadius:10, fontWeight:700, fontSize:14, color:'#64748b', background:'#fff', cursor:'pointer' }}>Cancel</button>
                  <button onClick={saveEdit} style={{ padding:'10px 24px', background:'linear-gradient(135deg,#082447,#163970)', border:'none', borderRadius:10, fontWeight:700, fontSize:14, color:'#fff', cursor:'pointer', boxShadow:'0 4px 12px rgba(8,36,71,0.25)' }}>
                    <span className="material-symbols-outlined" style={{ fontSize:16, verticalAlign:'middle', marginRight:4 }}>save</span>Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

                <div>
                  <div className="portal-wordmark" style={{ color:'#fff', fontWeight:900, fontSize:'18px', letterSpacing:'0.18em' }}>SAHAYAK</div>
                  <div className="portal-subtitle" style={{ color:'#d4af37', fontSize:'9px', fontWeight:700, letterSpacing:'0.2em', textTransform:'uppercase' }}>Volunteer Portal · Karnataka State Police</div>
                </div>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
                <div className="header-action" style={{ display:'flex', alignItems:'center', gap:2, padding:3, borderRadius:10, border:'1px solid rgba(255,255,255,0.22)', background:'rgba(255,255,255,0.08)' }} aria-label="Choose language">
                  {[['EN','English'],['KN','ಕನ್ನಡ'],['HI','हिन्दी']].map(([code, label]) => (
                    <button key={code} type="button" onClick={() => setLanguage(code)} title={label} style={{ border:'none', borderRadius:7, padding:'5px 7px', cursor:'pointer', fontWeight:800, fontSize:11, background:language===code ? '#d4af37' : 'transparent', color:language===code ? '#082447' : '#fff' }}>{label}</button>
                  ))}
                </div>
                <button className="header-action" onClick={() => setOnDuty(!onDuty)} style={{ display:'flex', alignItems:'center', gap:'8px', padding:'6px 16px', borderRadius:'12px', fontWeight:700, fontSize:'13px', border:'1px solid', background: onDuty ? 'linear-gradient(90deg,#022c22,#064e3b)' : 'linear-gradient(90deg,#1e293b,#334155)', borderColor: onDuty ? '#065f46' : '#475569', color:'#fff', cursor:'pointer' }}>
                  <span className="live-dot" style={{ width:10, height:10, borderRadius:'50%', background: onDuty ? '#4ade80' : '#94a3b8', display:'inline-block' }}></span>
                  {onDuty ? 'ON DUTY' : 'OFF DUTY'}
                  <span className="material-symbols-outlined" style={{ fontSize:'20px' }}>{onDuty ? 'toggle_on' : 'toggle_off'}</span>
                </button>
                <a className="header-action" href="login.html" style={{ display:'flex', alignItems:'center', gap:'6px', padding:'7px 14px', borderRadius:'10px', background:'rgba(220,38,38,0.85)', border:'1px solid rgba(239,68,68,0.5)', color:'#fff', fontWeight:700, fontSize:'13px', textDecoration:'none' }}>
                  <span className="material-symbols-outlined" style={{ fontSize:'18px' }}>logout</span><span>Logout</span>
                </a>
              </div>
            </div>
          </header>

          {/* ─── MAIN ─── */}
          <div className="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 py-4">
            <ProfileBanner profile={profile} onDuty={onDuty} onEdit={openEdit} idCopied={idCopied} onCopyId={copyId} language={language} />
            <div className="vol-grid" style={{ display:'grid', gridTemplateColumns:'300px 1fr', gap:'18px', alignItems:'start', marginTop:'18px' }}>

              {/* ═══ SIDEBAR ═══ */}
              <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>

                {/* Profile Identity Card */}
                <div className="card-static volunteer-sidebar-card fade-up">
                  <div className="profile-summary" style={{ padding:'14px 16px', textAlign:'center', background:'linear-gradient(180deg,#f8fafc 0%,#fff 100%)', borderBottom:'1px solid #f1f5f9' }}>
                    <div style={{ display:'flex', justifyContent:'center', marginBottom:10 }}>
                      <div style={{ position:'relative' }}>
                        <img src={profile.photoUrl} alt={profile.name}
                          style={{ width:72, height:72, borderRadius:'50%', objectFit:'cover', border:'3px solid #d4af37', boxShadow:'0 0 0 4px rgba(212,175,55,0.1), 0 3px 12px rgba(8,36,71,0.16)' }}
                          onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                        <div style={{ display:'none', width:72, height:72, borderRadius:'50%', background:'linear-gradient(135deg,#082447,#163970)', alignItems:'center', justifyContent:'center', fontSize:24, fontWeight:900, color:'#fff', border:'3px solid #d4af37' }}>{profile.initials}</div>
                        <div style={{ position:'absolute', bottom:2, right:2, width:14, height:14, borderRadius:'50%', background: onDuty ? '#22c55e' : '#94a3b8', border:'2px solid #fff' }}></div>
                      </div>
                    </div>
                    <div style={{ fontWeight:900, fontSize:15, color:'#0f172a' }}>{profile.name}</div>
                    <div style={{ fontSize:10, color:'#64748b', fontWeight:600, marginTop:2 }}>KSP Sahayak Volunteer</div>
                    <div style={{ display:'flex', justifyContent:'center', marginTop:6 }}>
                      <span style={{ fontSize:11, fontWeight:800, color:'#163970', fontFamily:'monospace', background:'#f0f4fa', padding:'2px 8px', borderRadius:20, border:'1px solid #dbeafe', letterSpacing:'0.06em' }}>{profile.sahayakId}</span>
                    </div>
                  </div>

                  {/* Quick stats */}
                  <div className="profile-quick-stats" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', borderBottom:'1px solid #f1f5f9' }}>
                    {[
                      { val: VOLUNTEER_STATS.requestsCompleted + resolved.length, label:'Tasks' },
                      { val: VOLUNTEER_STATS.hoursServed, label:'Hours' },
                    ].map((s,i) => (
                      <div key={s.label} style={{ padding:'9px 6px', textAlign:'center', borderRight: i<1 ? '1px solid #f1f5f9' : 'none' }}>
                        <div style={{ fontSize:15, fontWeight:900, color:'#082447' }}>{s.val}</div>
                        <div style={{ fontSize:9, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.04em' }}>{s.label}</div>
                      </div>
                    ))}
                  </div>

                  {/* Side Tabs */}
                  <div style={{ padding:'10px', display:'flex', background:'#f8fafc', gap:4 }}>
                    {[['profile','person','Profile'],['service','volunteer_activism','Service']].map(([k,ic,lb]) => (
                      <button key={k} onClick={() => setSideTab(k)} style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:5, padding:'7px', borderRadius:9, fontSize:11, fontWeight:700, border:'none', cursor:'pointer', background: sideTab===k ? '#fff' : 'transparent', color: sideTab===k ? '#082447' : '#64748b', boxShadow: sideTab===k ? '0 1px 4px rgba(0,0,0,0.08)' : 'none' }}>
                        <span className="material-symbols-outlined" style={{ fontSize:15 }}>{ic}</span>{lb}
                      </button>
                    ))}
                  </div>

                  <div style={{ padding:'0 14px 14px' }}>
                    {sideTab === 'profile' && (
                      <div className="fade-up">
                        <div className="section-label" style={{ marginTop:10 }}>Personal Information</div>
                        <InfoRow icon="cake"          label="Date of Birth"   value={t(profile.dob, language)} />
                        <InfoRow icon="wc"            label="Gender"          value={t(profile.gender, language)} />
                        <InfoRow icon="phone"         label="Contact"         value={profile.phone} />
                        <InfoRow icon="email"         label="Email"           value={profile.email} />
                        <div className="section-label" style={{ marginTop:10 }}>Residential Address</div>
                        <InfoRow icon="home"          label="Address"         value={t(profile.address, language)} />
                        <InfoRow icon="location_city" label="Village / Taluk" value={t(profile.village, language) + ' \u00b7 ' + t(profile.taluk, language)} />
                        <InfoRow icon="location_on"   label="District & PIN"  value={t(profile.district, language) + ', ' + t(profile.state, language) + ' \u2013 ' + profile.pinCode} />
                        <div className="section-label" style={{ marginTop:10 }}>Emergency Contact</div>
                        <InfoRow icon="contacts" label={profile.emergencyContact.name + ' (' + t(profile.emergencyContact.relation, language) + ')'} value={profile.emergencyContact.phone} />
                      </div>
                    )}
                    {sideTab === 'service' && (
                      <div className="fade-up">
                        <div className="section-label" style={{ marginTop:14 }}>Languages</div>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:16 }}>
                          {profile.languages.map(l => (
                            <span key={l} className="skill-tag">
                              <span className="material-symbols-outlined" style={{ fontSize:11 }}>translate</span>{t(l, language)}
                            </span>
                          ))}
                        </div>
                        <div className="section-label">Skills &amp; Capabilities</div>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:16 }}>
                          {profile.skills.map(s => (
                            <span key={s} className="skill-tag" style={{ background:'#faf5ff', color:'#7c3aed', border:'1px solid #ddd6fe' }}>
                              <span className="material-symbols-outlined" style={{ fontSize:11 }}>done</span>{t(s, language)}
                            </span>
                          ))}
                        </div>
                        <div className="section-label">Service Area</div>
                        <div style={{ fontSize:11, color:'#64748b', marginBottom:7 }}>{t('Udupi District', language)} · {t(profile.district, language)}</div>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:16 }}>
                          {profile.serviceAreas.map(a => (
                            <span key={a} className="skill-tag">
                              <span className="material-symbols-outlined" style={{ fontSize:11 }}>location_on</span>{t(a, language)}
                            </span>
                          ))}
                        </div>
                        <div className="section-label">Availability</div>
                        <div style={{ background:'#f0fdf4', border:'1px solid #bbf7d0', borderRadius:11, padding:'12px 14px' }}>
                          <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:6 }}>
                            <span style={{ width:8, height:8, borderRadius:'50%', background:'#22c55e', display:'inline-block' }}></span>
                            <span style={{ fontWeight:800, fontSize:13, color:'#0f172a' }}>{t(profile.availability, language)}</span>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Monthly Progress */}
                <div className="card-static progress-card fade-up-2" style={{ padding:'12px 14px' }}>
                  <div className="section-label">Monthly Progress — September 2026</div>
                  {[
                    { label:'Medical', done:3, total:4 },
                    { label:'Grocery', done:2, total:3 },
                    { label:'Escort',  done:2, total:2 },
                  ].map(p => (
                    <div key={p.label} style={{ marginBottom:11 }}>
                      <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, fontWeight:700, color:'#475569', marginBottom:4 }}>
                        <span>{t(p.label, language)}</span><span style={{ color:'#163970' }}>{p.done}/{p.total}</span>
                      </div>
                      <div style={{ width:'100%', background:'#e2e8f0', borderRadius:3, height:5 }}>
                        <div className="progress-fill" style={{ width:`${(p.done/p.total)*100}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>

              </div>

              {/* ═══ MAIN CONTENT ═══ */}
              <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>

                <div className="fade-up-1">
                  <StatsBar stats={VOLUNTEER_STATS} extra={resolved.length} />
                </div>

                {/* Mission Control */}
                <div className="mission-zone fade-up-2">
                  <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', justifyContent:'space-between', gap:10, marginBottom:10 }}>
                    <div>
                      <h1 className="premium-heading" style={{ fontWeight:900, color:'#082447', margin:0 }}>Mission Control</h1>
                      <p style={{ fontSize:12, color:'#64748b', margin:'2px 0 0 0', fontWeight:500 }}>
                        {t('Udupi District', language)} · {t('Shirva Circle', language)} · {new Date().toLocaleDateString(language === 'KN' ? 'kn-IN' : language === 'HI' ? 'hi-IN' : 'en-IN',{ weekday:'long', day:'numeric', month:'long', year:'numeric' })}
                      </p>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', background:'#fff', border:'1px solid #e2e8f0', borderRadius:12, padding:4, boxShadow:'0 1px 4px rgba(0,0,0,0.06)' }}>
                      {[['active','Active',active.length],['history','History',histAll.length]].map(([key,label,count]) => (
                        <button key={key} onClick={() => setTab(key)} style={{ padding:'7px 18px', borderRadius:9, fontSize:12, fontWeight:700, border:'none', cursor:'pointer', background: tab===key ? 'linear-gradient(135deg,#082447,#163970)' : 'transparent', color: tab===key ? '#fff' : '#64748b', transition:'all 0.2s' }}><span>{t(label, language)}</span> ({count})</button>
                      ))}
                    </div>
                  </div>

                  {tab === 'active' && (
                    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
                      {active.length === 0 && (
                        <div className="card" style={{ padding:'48px', textAlign:'center' }}>
                          <span className="material-symbols-outlined" style={{ fontSize:'56px', color:'#cbd5e1', fontVariationSettings:"'FILL' 1" }}>task_alt</span>
                          <p style={{ color:'#94a3b8', fontWeight:700, marginTop:'12px', fontSize:'15px' }}>All missions completed. Great work today!</p>
                        </div>
                      )}
                      <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'16px', overflow:'hidden', boxShadow:'0 4px 6px rgba(0,0,0,0.02)' }}>
                        <div className="mission-grid mission-table-head" style={{ padding:'14px 22px', background:'#f8fafc', borderBottom:'2px solid #e2e8f0', fontWeight:800, fontSize:'11px', color:'#64748b', textTransform:'uppercase', letterSpacing:'0.05em' }}>
                          <div>Mission Details</div><div>Citizen Info</div><div>Status &amp; Priority</div><div style={{ textAlign:'right' }}>Actions</div>
                        </div>
                        {active.map((m,i) => (
                          <div key={m.id} className="mission-grid" style={{ padding:'20px 22px', borderBottom:'1px solid #f1f5f9', background: i%2===0 ? '#fff' : '#fafafa', alignItems:'center', animation:`fadeUp 0.4s ${i*0.1}s ease both`, transition:'background 0.2s' }}
                            onMouseEnter={e => e.currentTarget.style.background='#f0f9ff'}
                            onMouseLeave={e => e.currentTarget.style.background= i%2===0 ? '#fff' : '#fafafa'}>
                            <div>
                              <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'6px' }}>
                                <span className="material-symbols-outlined" style={{ fontSize:'22px', color:m.iconColor, fontVariationSettings:"'FILL' 1" }}>{m.icon}</span>
                                <div style={{ fontSize:'15px', fontWeight:900, color:'#0f172a' }}>{m.type}</div>
                              </div>
                              <div style={{ fontSize:'11px', color:'#64748b', fontWeight:500, marginBottom:'8px', display:'flex', alignItems:'center', gap:'8px' }}>
                                <span style={{ fontWeight:800, color:'#94a3b8', fontFamily:'monospace' }}>{m.id}</span>
                                <span>•</span>
                                <span style={{ display:'flex', alignItems:'center', gap:'4px' }}><span className="material-symbols-outlined" style={{ fontSize:'13px' }}>schedule</span>{m.time}</span>
                                <span>•</span>
                                <span style={{ display:'flex', alignItems:'center', gap:'4px' }}><span className="material-symbols-outlined" style={{ fontSize:'13px' }}>near_me</span>{m.distance}</span>
                              </div>
                              <div style={{ fontSize:'11px', color:'#475569', lineHeight:1.4 }}>{m.notes}</div>
                            </div>
                            <div>
                              <div style={{ fontSize:'13px', fontWeight:800, color:'#1e293b', marginBottom:'4px' }}>{m.senior} (<span>Age</span> {m.age})</div>
                              <div style={{ fontSize:'11px', color:'#64748b', display:'flex', alignItems:'flex-start', gap:'6px', lineHeight:1.4 }}>
                                <span className="material-symbols-outlined" style={{ fontSize:'13px', color:'#ef4444', marginTop:'2px' }}>location_on</span>{m.address}
                              </div>
                              <div style={{ display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'8px' }}>
                                {m.tags.map(t => (
                                  <span key={t} style={{ fontSize:'10px', fontWeight:800, padding:'2px 8px', borderRadius:'12px', background:'#f0f4fa', color:'#163970', border:'1px solid #dbeafe' }}>{t}</span>
                                ))}
                              </div>
                            </div>
                            <div style={{ display:'flex', flexDirection:'column', gap:'8px', alignItems:'flex-start' }}>
                              <PBadge p={m.priority} />
                              <SBadge s={accepted.includes(m.id) ? 'Accepted' : m.status} />
                            </div>
                            <div className="mission-actions">
                              {!accepted.includes(m.id) && <button onClick={() => setAccepted(prev => [...prev, m.id])} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%', maxWidth:'120px', padding:'8px', borderRadius:'8px', fontWeight:700, fontSize:'12px', background:'#dcfce7', border:'1px solid #86efac', color:'#166534', cursor:'pointer' }}>
                                <span className="material-symbols-outlined" style={{ fontSize:'15px', marginRight:'4px' }}>check</span> Accept
                              </button>}
                              {!accepted.includes(m.id) && <button onClick={() => setDeclined(prev => [...prev, m.id])} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%', maxWidth:'120px', padding:'8px', borderRadius:'8px', fontWeight:700, fontSize:'12px', background:'#fef2f2', border:'1px solid #fecaca', color:'#b91c1c', cursor:'pointer' }}>
                                <span className="material-symbols-outlined" style={{ fontSize:'15px', marginRight:'4px' }}>close</span> Decline
                              </button>}
                              {accepted.includes(m.id) && <>
                                <a href={`tel:${m.phone}`} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%', maxWidth:'120px', padding:'8px', borderRadius:'8px', fontWeight:700, fontSize:'12px', background:'#fff', border:'1px solid #e2e8f0', color:'#334155', textDecoration:'none' }}>
                                  <span className="material-symbols-outlined" style={{ fontSize:'15px', marginRight:'4px' }}>call</span> Call
                                </a>
                                <button style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%', maxWidth:'120px', padding:'8px', borderRadius:'8px', fontWeight:700, fontSize:'12px', background:'#ede9fe', border:'1px solid #ddd6fe', color:'#6d28d9', cursor:'pointer' }}>
                                  <span className="material-symbols-outlined" style={{ fontSize:'15px', marginRight:'4px' }}>map</span> Navigate
                                </button>
                                <button onClick={() => setResolved(prev => [...prev, m.id])} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%', maxWidth:'120px', padding:'8px', borderRadius:'8px', fontWeight:700, fontSize:'12px', background:'linear-gradient(135deg,#082447,#163970)', border:'none', color:'#fff', cursor:'pointer', boxShadow:'0 2px 8px rgba(8,36,71,0.2)' }}>
                                  <span className="material-symbols-outlined" style={{ fontSize:'15px', marginRight:'4px', fontVariationSettings:"'FILL' 1" }}>check_circle</span> Resolve
                                </button>
                              </>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {tab === 'history' && <ActivitySection histAll={histAll} />}
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<VolunteerDashboard />);
  </script>
</body>
</html>
