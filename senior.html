      'Identity & Eligibility':'पहचान और पात्रता', 'Aadhaar Number':'आधार नंबर', 'Aadhaar Number (masked)':'आधार नंबर (छिपाया गया)', 'Senior Citizen Card Number':'वरिष्ठ नागरिक कार्ड नंबर', 'Blood Group':'रक्त समूह', 'Masked for privacy':'गोपनीयता के लिए छिपाया गया',

    const SENIOR_PROFILE = {
      sahayakId: 'SAH-SC-000341',

      initials: 'RB',
      role: 'Senior Citizen',
      age: 74,

      pinCode: '574116',
      emergencyContact: { name: 'Suresh Bhat', relation: 'Son', phone: '+91 99001 23456' },
      registrationDate: 'August 2026',
      verificationStatus: 'Profile Verified',
      lastUpdated: 'September 2026',
      preferredLanguages: ['Kannada', 'Tulu', 'Hindi', 'English'],
      photo: '',
      aadhaar: 'XXXX XXXX 4821',
      seniorCardNumber: 'KSP-SC-UDU-2026-0341',

    };

    const REQUESTS = [
      {
        id: 'REQ-809', type: 'Medical Assistance', date: 'Today, 10:30 AM', status: 'Volunteer Assigned',
        statusColor: '#92400e', statusBg: '#fef3c7', statusBorder: '#fde68a',
        volunteer: 'Ramesh Kumar', phone: '+919876543210', eta: '~15 minutes away',
        volId: 'SAH-VL-004091', stationVerified: true
      },
      {
        id: 'REQ-752', type: 'Medicine Delivery', date: 'Sep 12, 2026', status: 'Completed',
        statusColor: '#15803d', statusBg: '#dcfce7', statusBorder: '#bbf7d0',
        volunteer: 'Suresh Shetty', phone: '', eta: null, volId: 'SAH-VL-003812', stationVerified: true
      },
      {
        id: 'REQ-701', type: 'Grocery Assistance', date: 'Sep 5, 2026', status: 'Completed',
        statusColor: '#15803d', statusBg: '#dcfce7', statusBorder: '#bbf7d0',
        volunteer: 'Meena Alva', phone: '', eta: null, volId: 'SAH-VL-004205', stationVerified: true
      }
    ];

    function InfoRow({ icon, label, value, large }) {
      return (
        <div className="info-row">
          <span className="material-symbols-outlined" style={{ fontSize: large ? 28 : 22, color:'#163970', fontVariationSettings:"'FILL' 1", flexShrink:0, marginTop:2 }}>{icon}</span>
          <div>
            <div style={{ fontSize:'11px', color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:2 }}>{label}</div>
            <div style={{ fontSize: large ? '18px' : '15px', fontWeight:800, color:'#0f172a', lineHeight:1.4 }}>{value}</div>
          </div>
        </div>
      );
    }

    function SeniorProfile() {
      const [editOpen, setEditOpen] = useState(false);
      const [profile, setProfile] = useState(SENIOR_PROFILE);
      const [editData, setEditData] = useState({});
      const [idCopied, setIdCopied] = useState(false);
      const [language, setLanguage] = useState('en');
      const [otherLanguage, setOtherLanguage] = useState('');
      const photoInputRef = useRef(null);

      useEffect(() => {
        const dictionary = TRANSLATIONS[language];
        document.title = PAGE_TITLES[language] || PAGE_TITLES.en;
        const walker = document.createTreeWalker(document.getElementById('root'), NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        const restorePairs = Object.entries(TRANSLATIONS)
          .flatMap(([, translations]) => Object.entries(translations).map(([english, translated]) => [translated, english]))
          .sort((a, b) => b[0].length - a[0].length);
        const terms = dictionary ? Object.keys(dictionary).sort((a, b) => b.length - a.length) : [];
        nodes.forEach(node => {
          if (node.parentElement?.classList.contains('material-symbols-outlined')) return;
          let value = node.nodeValue;
          restorePairs.forEach(([translated, english]) => { value = value.split(translated).join(english); });
          terms.forEach(term => { value = value.split(term).join(dictionary[term]); });
          node.nodeValue = value;
        });

        // Translate helpful labels on controls too (for screen readers and tooltips).
        document.getElementById('root').querySelectorAll('[title],[aria-label],[placeholder]').forEach(element => {
          ['title', 'aria-label', 'placeholder'].forEach(attribute => {
            if (!element.hasAttribute(attribute)) return;
            let value = element.getAttribute(attribute);
            restorePairs.forEach(([translated, english]) => { value = value.split(translated).join(english); });
            terms.forEach(term => { value = value.split(term).join(dictionary[term]); });
            element.setAttribute(attribute, value);
          });
        });
      }, [language, editOpen]);

      const copyId = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(profile.sahayakId).then(() => {
            setIdCopied(true);
            setTimeout(() => setIdCopied(false), 2500);
          });
        }
      };

      const openEdit = () => { setEditData({ ...profile }); setOtherLanguage(''); setEditOpen(true); };
      const saveEdit = () => { setProfile({ ...editData }); setEditOpen(false); };
      const addOtherLanguage = () => {
        const value = otherLanguage.trim();
        if (!value) return;
        setEditData(previous => ({ ...previous, preferredLanguages: (previous.preferredLanguages || []).includes(value) ? previous.preferredLanguages : [...(previous.preferredLanguages || []), value] }));
        setOtherLanguage('');
      };
      const handlePhotoSelect = event => {
        const file = event.target.files && event.target.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = () => setEditData(previous => ({ ...previous, photo: reader.result }));
        reader.readAsDataURL(file);
      };

      return (
        <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:'#f1f5f9' }}>

          {/* ─── EDIT PROFILE MODAL ─── */}

            <div style={{ position:'fixed', inset:0, zIndex:100, background:'rgba(2,12,27,0.75)', backdropFilter:'blur(4px)', display:'flex', alignItems:'center', justifyContent:'center', padding:16, overflowY:'auto' }}>

                    </div>
                    <div>
                      <div style={{ fontWeight:900, fontSize:18, color:'#0f172a' }}>Update Profile Record</div>
                      <div style={{ fontSize:12, color:'#64748b' }}>Authorised staff update only</div>
                    </div>
                  </div>

                    <span className="material-symbols-outlined">close</span>
                  </button>
                </div>

                    <div style={{ fontSize:10, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:2 }}>Sahayak ID</div>

                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, fontWeight:700, color:'#64748b', background:'#f1f5f9', padding:'4px 10px', borderRadius:8, border:'1px solid #e2e8f0' }}>
                    <span className="material-symbols-outlined" style={{ fontSize:14 }}>lock</span> System Generated
                  </div>
                </div>

                <div className="edit-grid" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                  <div className="edit-address" style={{ gridColumn:'span 2', display:'flex', alignItems:'center', gap:14, padding:'14px', border:'1px solid #bfdbfe', borderRadius:12, background:'#f8fbff' }}>
                    <div style={{ width:60, height:60, flexShrink:0, borderRadius:'50%', overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center', background:'#163970', border:'2px solid #d4af37', color:'#fff', fontSize:18, fontWeight:900 }}>
                      {editData.photo ? <img src={editData.photo} alt="Profile Photo" style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : profile.initials}
                    </div>
                    <div style={{ minWidth:0, flex:1 }}>
                      <label style={{ display:'block', fontSize:11, fontWeight:800, color:'#163970', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>Profile Photo</label>
                      <p style={{ fontSize:12, lineHeight:1.45, color:'#475569', fontWeight:600, margin:'0 0 9px' }}>Choose a clear profile photo for this record.</p>
                      <input ref={photoInputRef} type="file" accept="image/*" onChange={handlePhotoSelect} style={{ display:'none' }} />
                      <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
                        <button type="button" onClick={() => photoInputRef.current?.click()} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'7px 10px', borderRadius:9, border:'none', background:'#163970', color:'#fff', cursor:'pointer', fontSize:12, fontWeight:800 }}><span className="material-symbols-outlined" style={{ fontSize:15 }}>{editData.photo ? 'photo_camera' : 'upload'}</span>{editData.photo ? 'Change Photo' : 'Upload Photo'}</button>
                        {editData.photo && <button type="button" onClick={() => setEditData(previous => ({ ...previous, photo:'' }))} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'7px 10px', borderRadius:9, border:'1px solid #fecaca', background:'#fff', color:'#b91c1c', cursor:'pointer', fontSize:12, fontWeight:800 }}><span className="material-symbols-outlined" style={{ fontSize:15 }}>delete</span>Remove Photo</button>}
                      </div>
                    </div>
                  </div>
                  {[
                    { label:'Full Name', key:'name', icon:'person' },
                    { label:'Phone Number', key:'phone', icon:'phone' },
                    { label:'Email', key:'email', icon:'email' },
                    { label:'Date of Birth', key:'dob', icon:'cake' },
                    { label:'Aadhaar Number', key:'aadhaar', icon:'fingerprint' },
                    { label:'Blood Group', key:'bloodGroup', icon:'bloodtype' },
                    { label:'Senior Citizen Card Number', key:'seniorCardNumber', icon:'badge' },
                  ].map(f => (
                    <div key={f.key}>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>
                        {f.label}
                      </label>
                      <input
                        value={editData[f.key] || ''}
                        onChange={e => setEditData(prev => ({ ...prev, [f.key]: e.target.value }))}
                        style={{ width:'100%', padding:'10px 12px', border:'1px solid #cbd5e1', borderRadius:10, fontSize:14, fontWeight:600, color:'#0f172a', boxSizing:'border-box', outline:'none' }}
                        onFocus={e => e.target.style.borderColor='#163970'}
                        onBlur={e => e.target.style.borderColor='#cbd5e1'}
                      />
                    </div>
                  ))}
                  <div className="edit-address" style={{ gridColumn:'span 2' }}>
                    <label style={{ display:'block', fontSize:11, fontWeight:700, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>Address</label>
                    <input
                      value={editData.address || ''}
                      onChange={e => setEditData(prev => ({ ...prev, address: e.target.value }))}
                      style={{ width:'100%', padding:'10px 12px', border:'1px solid #cbd5e1', borderRadius:10, fontSize:14, fontWeight:600, color:'#0f172a', boxSizing:'border-box', outline:'none' }}
                      onFocus={e => e.target.style.borderColor='#163970'}
                      onBlur={e => e.target.style.borderColor='#cbd5e1'}
                    />
                  </div>
                  <div>
                    <label style={{ display:'block', fontSize:11, fontWeight:700, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>Emergency Contact Name</label>
                    <input
                      value={editData.emergencyContact?.name || ''}
                      onChange={e => setEditData(prev => ({ ...prev, emergencyContact: { ...prev.emergencyContact, name: e.target.value } }))}
                      style={{ width:'100%', padding:'10px 12px', border:'1px solid #cbd5e1', borderRadius:10, fontSize:14, fontWeight:600, color:'#0f172a', boxSizing:'border-box', outline:'none' }}
                      onFocus={e => e.target.style.borderColor='#163970'}
                      onBlur={e => e.target.style.borderColor='#cbd5e1'}
                    />
                  </div>
                  <div>
                    <label style={{ display:'block', fontSize:11, fontWeight:700, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>Emergency Contact Phone</label>
                    <input
                      value={editData.emergencyContact?.phone || ''}
                      onChange={e => setEditData(prev => ({ ...prev, emergencyContact: { ...prev.emergencyContact, phone: e.target.value } }))}
                      style={{ width:'100%', padding:'10px 12px', border:'1px solid #cbd5e1', borderRadius:10, fontSize:14, fontWeight:600, color:'#0f172a', boxSizing:'border-box', outline:'none' }}
                      onFocus={e => e.target.style.borderColor='#163970'}
                      onBlur={e => e.target.style.borderColor='#cbd5e1'}
                    />
                  </div>
                  <div className="edit-address" style={{ gridColumn:'span 2', padding:'14px', border:'1px solid #bfdbfe', borderRadius:12, background:'#eff6ff', marginTop:4 }}>
                    <label style={{ display:'flex', alignItems:'center', gap:6, fontSize:11, fontWeight:800, color:'#163970', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}><span className="material-symbols-outlined" style={{ fontSize:16 }}>translate</span>Preferred Languages</label>
                    <p style={{ fontSize:12, lineHeight:1.45, color:'#475569', fontWeight:600, margin:'0 0 10px' }}>Select every language suitable for volunteer communication.</p>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                      {['Kannada', 'Tulu', 'Hindi', 'English'].map(preference => {
                        const selected = (editData.preferredLanguages || []).includes(preference);
                        return <button key={preference} type="button" onClick={() => setEditData(prev => ({ ...prev, preferredLanguages: selected ? prev.preferredLanguages.filter(item => item !== preference) : [...(prev.preferredLanguages || []), preference] }))} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'7px 10px', borderRadius:9, cursor:'pointer', border:selected ? '1px solid #163970' : '1px solid #cbd5e1', background:selected ? '#163970' : '#fff', color:selected ? '#fff' : '#334155', fontSize:12, fontWeight:800 }}>
                          <span className="material-symbols-outlined" style={{ fontSize:15 }}>{selected ? 'check_circle' : 'add_circle'}</span>{preference}
                        </button>;
                      })}
                      {(editData.preferredLanguages || []).filter(preference => !['Kannada', 'Tulu', 'Hindi', 'English'].includes(preference)).map(preference => (
                        <button key={preference} type="button" onClick={() => setEditData(previous => ({ ...previous, preferredLanguages: previous.preferredLanguages.filter(item => item !== preference) }))} title="Remove Language" style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'7px 10px', borderRadius:9, cursor:'pointer', border:'1px solid #0f766e', background:'#ecfdf5', color:'#115e59', fontSize:12, fontWeight:800 }}>
                          <span className="material-symbols-outlined" style={{ fontSize:15 }}>close</span>{preference}
                        </button>
                      ))}

                    <div style={{ display:'flex', flexWrap:'wrap', alignItems:'end', gap:8, marginTop:12, paddingTop:11, borderTop:'1px solid #bfdbfe' }}>

                        <label style={{ display:'block', fontSize:10, fontWeight:800, color:'#475569', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em' }}>Other Language</label>

                      </div>
                      <button type="button" onClick={addOtherLanguage} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'9px 11px', borderRadius:9, border:'none', background:'#0f766e', color:'#fff', cursor:'pointer', fontSize:12, fontWeight:800 }}><span className="material-symbols-outlined" style={{ fontSize:15 }}>add</span>Add Language</button>
                    </div>
                  </div>
                </div>

                <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:12, marginTop:24, paddingTop:16, borderTop:'1px solid #f1f5f9' }}>
                  <button onClick={() => setEditOpen(false)} style={{ padding:'10px 20px', border:'1px solid #e2e8f0', borderRadius:10, fontWeight:700, fontSize:14, color:'#64748b', background:'#fff', cursor:'pointer' }}>Cancel</button>
                  <button onClick={saveEdit} style={{ padding:'10px 24px', background:'linear-gradient(135deg,#082447,#163970)', border:'none', borderRadius:10, fontWeight:700, fontSize:14, color:'#fff', cursor:'pointer', boxShadow:'0 4px 12px rgba(8,36,71,0.25)' }}>
                    <span className="material-symbols-outlined" style={{ fontSize:16, verticalAlign:'middle', marginRight:4 }}>save</span>
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ─── HEADER ─── */}
          <header style={{ background:'linear-gradient(135deg,#020c1b 0%,#082447 100%)', borderBottom:'3px solid #d4af37', position:'sticky', top:0, zIndex:50 }}>

              <div style={{ display:'flex', alignItems:'center', gap:12 }}>

                <div>
                  <div className="portal-wordmark" style={{ color:'#fff', fontWeight:900, fontSize:'20px', letterSpacing:'0.15em' }}>SAHAYAK</div>

              </div>
              <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                <div className="language-switch" role="group" aria-label="Select language">
                  {[['en','EN'],['kn','ಕ'],['hi','हि']].map(([code, label]) => (
                    <button key={code} type="button" className={language === code ? 'active' : ''} onClick={() => setLanguage(code)} title={code === 'en' ? 'English' : code === 'kn' ? 'Kannada' : 'Hindi'}>{label}</button>
                  ))}
                </div>
                <button type="button" onClick={openEdit} title="Update Profile Record" style={{ display:'flex', alignItems:'center', gap:6, padding:'6px 10px', borderRadius:10, background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.12)', color:'#dbeafe', fontSize:11, fontWeight:800, cursor:'pointer' }}>

                  <span className="material-symbols-outlined" style={{ fontSize:18 }}>logout</span>
                  <span className="hidden sm:inline">Logout</span>
                </a>
              </div>
            </div>

          {/* ─── BODY ─── */}

              borderRadius:20, padding:'24px',
              background:'linear-gradient(135deg,#082447 0%,#163970 100%)',

                      </span>
                      <button onClick={copyId} style={{ display:'flex', alignItems:'center', gap:4, fontSize:12, fontWeight:700, padding:'3px 10px', borderRadius:20, background:'rgba(255,255,255,0.1)', border:'1px solid rgba(255,255,255,0.2)', color: idCopied ? '#4ade80' : '#e2e8f0', cursor:'pointer' }}>
                        <span className="material-symbols-outlined" style={{ fontSize:13, fontVariationSettings:"'FILL' 1" }}>{idCopied ? 'check_circle' : 'content_copy'}</span>
                        {idCopied ? 'Copied!' : 'Copy ID'}
                      </button>
                      <span style={{ display:'flex', alignItems:'center', gap:3, fontSize:12, fontWeight:700, color:'#4ade80', padding:'3px 10px', borderRadius:20, background:'rgba(74,222,128,0.1)', border:'1px solid rgba(74,222,128,0.2)' }}>
                        <span className="material-symbols-outlined" style={{ fontSize:13, fontVariationSettings:"'FILL' 1" }}>verified_user</span>
                        {profile.verificationStatus}
                      </span>
                    </div>
                  </div>
                </div>
                <button className="hero-edit" onClick={openEdit} style={{ display:'flex', alignItems:'center', gap:6, padding:'10px 18px', borderRadius:12, fontWeight:700, fontSize:14, background:'rgba(255,255,255,0.1)', border:'1px solid rgba(255,255,255,0.2)', color:'#fff', cursor:'pointer', alignSelf:'flex-start' }}>
                  <span className="material-symbols-outlined" style={{ fontSize:16 }}>edit</span>
                  Update Record
                </button>
              </div>
            </div>

            {/* ══ VERIFIED PROFILE RECORD ══ */}
            {true && (
              <>
                <div className="fade-up-1" style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))', gap:10 }}>
                  <div style={{ padding:'14px 16px', borderRadius:14, background:'rgba(255,255,255,.92)', border:'1px solid #dbeafe', boxShadow:'0 3px 10px rgba(8,36,71,.05)', display:'flex', alignItems:'center', gap:10 }}>
                    <span className="material-symbols-outlined" style={{ color:'#15803d', fontVariationSettings:"'FILL' 1" }}>verified_user</span>
                    <div><div style={{ fontSize:10, fontWeight:800, color:'#64748b', textTransform:'uppercase', letterSpacing:'.06em' }}>Care status</div><div style={{ fontSize:13, fontWeight:900, color:'#166534' }}>Verified & protected</div></div>
                  </div>
                  <div style={{ padding:'14px 16px', borderRadius:14, background:'rgba(255,255,255,.92)', border:'1px solid #dbeafe', boxShadow:'0 3px 10px rgba(8,36,71,.05)', display:'flex', alignItems:'center', gap:10 }}>
                    <span className="material-symbols-outlined" style={{ color:'#2563eb', fontVariationSettings:"'FILL' 1" }}>local_police</span>
                    <div><div style={{ fontSize:10, fontWeight:800, color:'#64748b', textTransform:'uppercase', letterSpacing:'.06em' }}>Community care network</div><div style={{ fontSize:13, fontWeight:900, color:'#082447' }}>Shirva Police Station</div></div>
                  </div>
                  <a href="tel:14567" style={{ padding:'14px 16px', borderRadius:14, background:'linear-gradient(135deg,#082447,#163970)', border:'1px solid #d4af37', boxShadow:'0 5px 14px rgba(8,36,71,.16)', display:'flex', alignItems:'center', gap:10, color:'#fff', textDecoration:'none' }}>
                    <span className="material-symbols-outlined" style={{ color:'#fef08a', fontVariationSettings:"'FILL' 1" }}>support_agent</span>
                    <div><div style={{ fontSize:10, fontWeight:800, color:'#bfdbfe', textTransform:'uppercase', letterSpacing:'.06em' }}>Senior helpline</div><div style={{ fontSize:15, fontWeight:900 }}>14567</div></div>
                  </a>
                </div>
                {/* ══ 2. PERSONAL INFORMATION ══ */}
                <div className="fade-up-1 section-card" style={{ background:'linear-gradient(135deg,#ffffff 0%,#eff6ff 100%)', borderColor:'#bfdbfe' }}>
                  <h2 style={{ fontSize:16, fontWeight:900, color:'#0f172a', margin:'0 0 16px 0', display:'flex', alignItems:'center', gap:8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize:20, color:'#163970', fontVariationSettings:"'FILL' 1" }}>person</span>
                    Personal Information
                  </h2>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:0 }}>
                    <InfoRow icon="person" label="Full Name" value={profile.name} large />
                    <InfoRow icon="cake" label="Date of Birth" value={`${profile.dob} (Age ${profile.age})`} large />
                    <InfoRow icon="wc" label="Gender" value={profile.gender} />
                    <InfoRow icon="phone" label="Phone Number" value={profile.phone} large />
                    <InfoRow icon="email" label="Email Address" value={profile.email} />
                  </div>
                </div>

                {/* ══ IDENTITY & ELIGIBILITY ══ */}
                <div className="fade-up-1 section-card" style={{ background:'linear-gradient(135deg,#fff 0%,#f5f3ff 100%)', borderColor:'#ddd6fe' }}>
                  <h2 style={{ fontSize:16, fontWeight:900, color:'#0f172a', margin:'0 0 16px 0', display:'flex', alignItems:'center', gap:8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize:20, color:'#6d28d9', fontVariationSettings:"'FILL' 1" }}>badge</span>
                    Identity &amp; Eligibility
                  </h2>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:0 }}>
                    <InfoRow icon="fingerprint" label="Aadhaar Number (masked)" value={profile.aadhaar} large />
                    <InfoRow icon="badge" label="Senior Citizen Card Number" value={profile.seniorCardNumber} />
                    <InfoRow icon="bloodtype" label="Blood Group" value={profile.bloodGroup} large />
                  </div>
                  <div style={{ display:'inline-flex', alignItems:'center', gap:5, marginTop:4, padding:'5px 9px', borderRadius:8, background:'#f3e8ff', color:'#6b21a8', fontSize:11, fontWeight:800 }}><span className="material-symbols-outlined" style={{ fontSize:14 }}>lock</span>Masked for privacy</div>
                </div>

                {/* ══ PREFERRED LANGUAGES ══ */}
                <div className="fade-up-2 section-card" style={{ background:'linear-gradient(135deg,#eff6ff 0%,#fff 55%,#faf5ff 100%)', borderColor:'#bfdbfe' }}>
                  <h2 style={{ fontSize:16, fontWeight:900, color:'#0f172a', margin:'0 0 7px', display:'flex', alignItems:'center', gap:8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize:20, color:'#2563eb', fontVariationSettings:"'FILL' 1" }}>translate</span>
                    Preferred Languages
                  </h2>
                  <p style={{ fontSize:12, color:'#64748b', fontWeight:600, margin:'0 0 14px' }}>Volunteer communication can be arranged in these languages.</p>
                  <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:7 }}>
                    {(profile.preferredLanguages || []).map(preference => (
                      <span key={preference} className="preference-chip"><span className="material-symbols-outlined" style={{ fontSize:14 }}>translate</span>{preference}</span>
                    ))}
                    <button type="button" onClick={openEdit} title="Edit language preferences" style={{ display:'inline-flex', alignItems:'center', gap:4, padding:'7px 10px', borderRadius:9, border:'1px dashed #2563eb', color:'#1d4ed8', background:'#fff', cursor:'pointer', fontSize:12, fontWeight:800 }}><span className="material-symbols-outlined" style={{ fontSize:15 }}>edit</span>Edit language preferences</button>
                  </div>
                </div>

                {/* ══ 3. RESIDENTIAL ADDRESS ══ */}
                <div className="fade-up-2 section-card" style={{ background:'linear-gradient(135deg,#ffffff 0%,#ecfdf5 100%)', borderColor:'#a7f3d0' }}>
                  <h2 style={{ fontSize:16, fontWeight:900, color:'#0f172a', margin:'0 0 16px 0', display:'flex', alignItems:'center', gap:8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize:20, color:'#163970', fontVariationSettings:"'FILL' 1" }}>home</span>
                    Residential Address
                  </h2>
                  <InfoRow icon="house" label="House / Building" value={profile.address} large />
                  <InfoRow icon="location_city" label="Village / Taluk" value={`${profile.village} · ${profile.taluk} Taluk`} />
                  <InfoRow icon="location_on" label="District · State · PIN" value={`${profile.district}, ${profile.state} – ${profile.pinCode}`} />
                </div>

                {/* ══ 4. EMERGENCY CONTACT ══ */}
                <div className="fade-up section-card" style={{ border:'2px solid #fde68a', background:'linear-gradient(135deg,#fffbeb 0%,#fff 100%)' }}>
                  <h2 style={{ fontSize:16, fontWeight:900, color:'#92400e', margin:'0 0 16px 0', display:'flex', alignItems:'center', gap:8 }}>
                    <span className="material-symbols-outlined" style={{ fontSize:20, color:'#d97706', fontVariationSettings:"'FILL' 1" }}>emergency_home</span>
                    Emergency Contact
                  </h2>
                  <InfoRow icon="person" label="Contact Name" value={profile.emergencyContact.name} large />
                  <InfoRow icon="diversity_1" label="Relationship" value={profile.emergencyContact.relation} />
                  <InfoRow icon="phone" label="Phone Number" value={profile.emergencyContact.phone} large />
                </div>

                {/* ══ 5. REGISTRATION INFO ══ */}
                <div className="fade-up section-card" style={{ background:'linear-gradient(135deg,#f8fafc,#f5f3ff)', border:'1px solid #ddd6fe' }}>
                  <h2 style={{ fontSize:14, fontWeight:900, color:'#64748b', margin:'0 0 14px 0', display:'flex', alignItems:'center', gap:8, textTransform:'uppercase', letterSpacing:'0.06em' }}>
                    <span className="material-symbols-outlined" style={{ fontSize:18, color:'#94a3b8' }}>info</span>
                    Registration Information
                  </h2>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:10 }}>
                    {[
                      { label:'Sahayak ID', val: profile.sahayakId, mono: true },
                      { label:'Registered On', val: profile.registrationDate },
                      { label:'Profile Status', val: profile.verificationStatus },
                      { label:'Last Updated', val: profile.lastUpdated },
                    ].map(d => (
                      <div key={d.label} style={{ padding:'10px 14px', background:'#fff', borderRadius:12, border:'1px solid #e2e8f0' }}>
                        <div style={{ fontSize:10, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:4 }}>{d.label}</div>
                        <div style={{ fontSize:14, fontWeight:800, color:'#0f172a', fontFamily: d.mono ? 'monospace' : 'inherit' }}>{d.val}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Edit Action */}
                <div style={{ textAlign:'center', paddingBottom:8 }}>
                  <button onClick={openEdit} style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'14px 32px', background:'linear-gradient(135deg,#082447,#163970)', border:'none', borderRadius:14, fontWeight:800, fontSize:16, color:'#fff', cursor:'pointer', boxShadow:'0 6px 20px rgba(8,36,71,0.2)' }}>
                    <span className="material-symbols-outlined" style={{ fontSize:20 }}>edit</span>
                    Update Personal Record
                  </button>
                </div>
              </>
            )}

            {/* Request activity belongs in the central portal, not this profile record. */}
            {false && (
              <>
                {/* Active Requests */}
                {activeRequests.length > 0 && activeRequests.map(req => (
                  <div key={req.id} className="fade-up" style={{ borderRadius:20, border:'2px solid #fde68a', background:'linear-gradient(135deg,#fffbeb 0%,#fff 100%)', padding:20 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
                      <span className="material-symbols-outlined" style={{ fontSize:20, color:'#d97706', fontVariationSettings:"'FILL' 1" }}>person_pin_circle</span>
                      <span style={{ fontWeight:900, fontSize:'17px', color:'#1e293b' }}>Volunteer is On the Way!</span>
                      <span style={{ marginLeft:'auto', fontSize:'12px', fontWeight:800, padding:'3px 12px', borderRadius:20, background: req.statusBg, color: req.statusColor, border:`1px solid ${req.statusBorder}` }}>{req.status}</span>
                    </div>
                    <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:14, padding:14, display:'flex', flexWrap:'wrap', alignItems:'center', justifyContent:'space-between', gap:14, marginBottom:12 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
                        <div style={{ width:52, height:52, borderRadius:'50%', background:'linear-gradient(135deg,#082447,#163970)', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:900, fontSize:'18px', flexShrink:0 }}>RK</div>
                        <div>
                          <div style={{ fontSize:11, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:2 }}>Your Volunteer</div>
                          <div style={{ fontSize:18, fontWeight:900, color:'#0f172a' }}>{req.volunteer}</div>
                          <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:3 }}>
                            <span style={{ fontSize:11, color:'#64748b', fontFamily:'monospace', fontWeight:600 }}>{req.volId}</span>
                            {req.stationVerified && (
                              <span style={{ display:'flex', alignItems:'center', gap:3, fontSize:11, fontWeight:700, color:'#15803d', background:'#f0fdf4', border:'1px solid #bbf7d0', padding:'2px 8px', borderRadius:20 }}>
                                <span className="material-symbols-outlined" style={{ fontSize:12, fontVariationSettings:"'FILL' 1" }}>verified</span>
                                Verified
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                      <div style={{ textAlign:'center', background:'#fef3c7', border:'1px solid #fde68a', borderRadius:12, padding:'8px 16px' }}>
                        <span className="material-symbols-outlined" style={{ fontSize:24, color:'#d97706' }}>directions_walk</span>
                        <div style={{ fontSize:13, fontWeight:800, color:'#92400e' }}>{req.eta}</div>
                      </div>
                    </div>
                    <a href={`tel:${req.phone}`} style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:'14px', borderRadius:14, background:'linear-gradient(135deg,#082447,#163970)', color:'#fff', fontWeight:800, fontSize:16, textDecoration:'none' }}>
                      <span className="material-symbols-outlined" style={{ fontSize:22, fontVariationSettings:"'FILL' 1" }}>call</span>
                      Call Volunteer
                    </a>
                  </div>
                ))}

                {/* History */}
                {historyRequests.length > 0 && (
                  <div className="fade-up section-card">
                    <h2 style={{ fontSize:16, fontWeight:900, color:'#0f172a', margin:'0 0 14px 0', display:'flex', alignItems:'center', gap:8 }}>
                      <span className="material-symbols-outlined" style={{ fontSize:20, color:'#163970', fontVariationSettings:"'FILL' 1" }}>history</span>
                      Past Requests
                    </h2>
                    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      {historyRequests.map(req => (
                        <div key={req.id} style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:14, padding:'14px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                            <div style={{ width:40, height:40, borderRadius:'50%', background:'#dcfce7', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                              <span className="material-symbols-outlined" style={{ fontSize:20, color:'#15803d', fontVariationSettings:"'FILL' 1" }}>task_alt</span>
                            </div>
                            <div>
                              <div style={{ fontWeight:800, fontSize:16, color:'#0f172a' }}>{req.type}</div>
                              <div style={{ fontSize:13, color:'#64748b', marginTop:2 }}>{req.volunteer} · {req.date}</div>
                            </div>
                          </div>
                          <span style={{ fontSize:12, fontWeight:800, padding:'4px 12px', borderRadius:20, background: req.statusBg, color: req.statusColor, border:`1px solid ${req.statusBorder}`, textTransform:'uppercase' }}>
                            {req.status}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}

          </div>

          {/* ─── FOOTER ─── */}
          <footer style={{ background:'linear-gradient(135deg,#020c1b 0%,#082447 100%)', borderTop:'3px solid #d4af37', padding:'20px 16px', marginTop:'auto' }}>
            <div style={{ maxWidth:820, margin:'0 auto', textAlign:'center' }}>
              <div style={{ color:'#fff', fontWeight:800, fontSize:16, marginBottom:4 }}>Need phone help?</div>
              <div style={{ color:'#93c5fd', fontSize:14, marginBottom:8 }}>
                Call toll-free helpline:
                <a href="tel:14567" style={{ color:'#d4af37', fontWeight:900, marginLeft:8, fontSize:18, textDecoration:'none' }}>14567</a>
              </div>
              <div style={{ color:'rgba(147,197,253,0.5)', fontSize:11 }}>Karnataka State Police · Udupi District · Sahayak Programme</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SeniorProfile />);
  </script>
</body>
</html>
